name: life_usage
description: "Android app-usage sessions for the life agent. Reads UsageStats on the phone; nothing leaves it."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.boomchick.life_usage
        pluginClass: LifeUsagePlugin
