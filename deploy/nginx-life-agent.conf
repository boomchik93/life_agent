# Installed as /etc/nginx/sites-available/life-agent. `certbot --nginx -d <host>`
# adds the TLS listener and the http->https redirect to this same file.
server {
    listen 80;
    listen [::]:80;
    server_name life.144-31-165-229.sslip.io;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:18010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
